name: flux
description: A comprehensive financial wellness platform
publish_to: "none"
version: 2.1.0+15

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  cloud_functions: ^6.0.1
  google_sign_in: ^6.2.2

  # UI & Design

  # Utilities
  uuid: ^4.2.1
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  home_widget: ^0.7.0

  # Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.1

  # Permissions
  permission_handler: ^12.0.1
  # Charts & Analytics
  fl_chart: ^1.1.0

  # Date & Time
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.0
  
  # Skeleton Loading
  shimmer: ^3.0.0
  in_app_purchase: ^3.2.3
  
  # Data Export
  csv: ^6.0.0
  pdf: ^3.11.0
  share_plus: ^11.0.0
  flutter_timezone: ^5.0.1
  workmanager: ^0.9.0+3
  file_saver: ^0.3.1
  lucide_icons_flutter: ^3.1.15
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  # Source artwork lives in assets/brand/ (not bundled into the app).
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/flux_icon_foreground.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/flux_icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/flux_icon_monochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/brand/flux_icon_foreground.png"
    background_color: "#FFFFFF"
    theme_color: "#0079DC"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist/Geist-Black.ttf
          weight: 800
        - asset: assets/fonts/Geist/Geist-UltraBlack.ttf
          weight: 900
