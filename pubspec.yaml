name: flux
description: A comprehensive financial wellness platform
publish_to: "none"
version: 2.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  google_sign_in: ^6.2.2

  # UI & Design
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  lottie: ^3.3.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  home_widget: ^0.7.0

  # Notifications
  flutter_local_notifications: ^19.4.1
  timezone: ^0.10.1

  # Permissions
  permission_handler: ^12.0.1
  # Charts & Analytics
  fl_chart: ^1.1.0

  # Date & Time
  table_calendar: ^3.0.9
  font_awesome_flutter: ^10.10.0
  lucide_icons: ^0.257.0
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.0
  
  # Skeleton Loading
  shimmer: ^3.0.0
  in_app_purchase: ^3.2.3
  google_mobile_ads: ^7.0.0
  
  # Data Export
  csv: ^6.0.0
  pdf: ^3.11.0
  share_plus: ^11.0.0
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/flux_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0079DC"
  adaptive_icon_foreground: "assets/images/flux_logo.png"
  adaptive_icon_monochrome: "assets/images/flux_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/fonts/Satoshi/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi/Satoshi-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi/Satoshi-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Black.ttf
          weight: 900
        - asset: assets/fonts/Satoshi/Satoshi-BlackItalic.ttf
          weight: 900
          style: italic
